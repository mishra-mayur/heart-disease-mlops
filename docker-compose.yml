services:
  api:
    build: .
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    depends_on: [prometheus]

