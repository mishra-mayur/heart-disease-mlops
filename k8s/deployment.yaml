apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  namespace: heart-mlops
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-disease-api}
  template:
    metadata:
      labels: {app: heart-disease-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/mishra-mayur/heart-disease-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}

